<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>导出图标</title>
  <style>
    body { background: #333; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
    canvas { border: 1px solid #666; }
    p { color: #ccc; margin-top: 16px; }
    button { margin-top: 12px; padding: 10px 24px; font-size: 16px; cursor: pointer; border: none; border-radius: 8px; background: #6C5CE7; color: white; }
  </style>
</head>
<body>
  <canvas id="canvas" width="144" height="144"></canvas>
  <p>144×144 PNG 预览（右键保存或点击按钮下载）</p>
  <button onclick="download()">下载 PNG</button>

  <script>
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
      <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#4a1a8a"/>
          <stop offset="50%" style="stop-color:#6C5CE7"/>
          <stop offset="100%" style="stop-color:#8B5CF6"/>
        </linearGradient>
        <linearGradient id="storm" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#FFD700"/>
          <stop offset="100%" style="stop-color:#FF8C00"/>
        </linearGradient>
        <linearGradient id="brain" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#FF6B9D"/>
          <stop offset="100%" style="stop-color:#C084FC"/>
        </linearGradient>
      </defs>
      <rect width="144" height="144" rx="32" fill="url(#bg)"/>
      <ellipse cx="72" cy="78" rx="45" ry="8" fill="white" opacity="0.08"/>
      <path d="M30 85 Q72 70 114 85" fill="none" stroke="white" stroke-width="1.5" opacity="0.1"/>
      <path d="M35 92 Q72 78 109 92" fill="none" stroke="white" stroke-width="1" opacity="0.08"/>
      <ellipse cx="38" cy="30" rx="14" ry="9" fill="white" opacity="0.15"/>
      <ellipse cx="48" cy="28" rx="10" ry="7" fill="white" opacity="0.12"/>
      <ellipse cx="100" cy="35" rx="12" ry="8" fill="white" opacity="0.12"/>
      <ellipse cx="110" cy="33" rx="8" ry="6" fill="white" opacity="0.1"/>
      <path d="M50 62c0-14 9-26 21-29 4-14 16-23 30-23 17 0 31 13 32 29 9 4 15 13 15 23 0 9-4 17-11 22 2 4 4 8 4 13 0 11-8 20-17 22-2 11-12 19-24 19-9 0-16-4-21-11-4 4-10 6-16 6-12 0-22-9-24-20-9-3-15-11-15-20 0-7 3-13 9-17-2-5-4-10-4-16z"
            fill="url(#brain)" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M72 36c-2 12-8 20-8 20" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      <path d="M72 36c2 12 8 20 8 20" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      <path d="M56 52c10 2 20 2 28 0" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      <path d="M52 68c12 4 24 4 36 0" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      <path d="M58 82c8-2 18-2 26 0" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
      <path d="M64 92c5-1 12-1 16 0" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
      <polygon points="82,30 67,66 78,66 60,105 95,60 82,60 97,30" fill="url(#storm)" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
      <polygon points="38,52 32,68 37,68 30,82 42,65 37,65 43,52" fill="#FFD700" opacity="0.7"/>
      <polygon points="108,48 103,62 107,62 101,74 111,60 107,60 112,48" fill="#FFD700" opacity="0.6"/>
      <path d="M25 100 Q45 90 65 95" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.2"/>
      <path d="M80 95 Q100 90 118 100" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.2"/>
      <path d="M30 108 Q55 98 80 103" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.15"/>
      <path d="M85 103 Q105 98 115 108" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.15"/>
      <polygon points="28,45 30,41 32,45 28,43 32,43" fill="white" opacity="0.8"/>
      <polygon points="115,72 117,68 119,72 115,70 119,70" fill="white" opacity="0.6"/>
      <polygon points="22,80 24,76 26,80 22,78 26,78" fill="white" opacity="0.5"/>
    </svg>`;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    const blob = new Blob([svg], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);

    img.onload = () => {
      ctx.drawImage(img, 0, 0, 144, 144);
      URL.revokeObjectURL(url);
    };
    img.src = url;

    function download() {
      const a = document.createElement('a');
      a.download = 'focus-storm-icon-144.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    }
  </script>
</body>
</html>
